name: extended_image
description: Custom image widget for Boorusama.
publish_to: 'none' 

environment:
  sdk: ^3.12.0
  flutter: ">=3.41.0"

resolution: workspace

dependencies:
  cache_manager:
    path: ../cache_manager
  dio: ^5.7.0
  equatable: ^2.0.7
  extended_image_library:
    git:
      url: https://github.com/khoadng/extended_image_library.git
      ref: fork
  flutter:
    sdk: flutter
  material_ui: ^1.2.0
  cupertino_ui: ^1.0.2
  flutter_libavif: ^0.1.1
  path: ^1.8.3
  path_provider: ^2.1.2
  retriable:
    path: ../retriable

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
