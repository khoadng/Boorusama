name: GitHub release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build and publish."
        required: true
        default: ""
      prerelease:
        description: "Mark the draft release as a prerelease"
        required: true
        type: boolean
        default: false
      recreate_release:
        description: "Delete an existing release and tag before publishing"
        required: true
        type: boolean
        default: false
      windows_only:
        description: "Build only Windows; skip release publication."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.actor == 'khoadng'
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.windows_only &&
          '[{"target":"windows-zip","os":"windows-latest","artifact_name":"boorusama-windows-zip"}]' ||
          '[{"target":"apk","os":"ubuntu-latest","artifact_name":"boorusama-apk"},
            {"target":"linux-tar.gz","os":"ubuntu-latest","artifact_name":"boorusama-linux-tar-gz"},
            {"target":"appimage","os":"ubuntu-latest","artifact_name":"boorusama-appimage"},
            {"target":"windows-zip","os":"windows-latest","artifact_name":"boorusama-windows-zip"},
            {"target":"ipa","os":"macos-latest","artifact_name":"boorusama-ipa"},
            {"target":"dmg","os":"macos-latest","artifact_name":"boorusama-dmg"}]') }}

    env:
      BOORUSAMA_USE_FVM: "false"
      OUTPUT_DIR: release-artifacts/${{ matrix.target }}

    steps:
      - name: Check out Boorusama
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          cache: true

      - name: Set up Xcode
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Android SDK
        if: matrix.target == 'apk'
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        if: matrix.target == 'apk'
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Install Linux native build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y meson ninja-build nasm

      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux-tar.gz' || matrix.target == 'appimage'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libgtk-3-dev \
            liblzma-dev \
            libmpv-dev \
            pkg-config

      - name: Install Windows build and packaging dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install meson ninja nasm --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          Update-SessionEnvironment
          $env:PATH -split ';' | Where-Object { $_ } | Add-Content -Path $env:GITHUB_PATH
          Get-Command Compress-Archive

      - name: Select Visual Studio CMake for Windows native builds
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 Microsoft.VisualStudio.Component.VC.CMake.Project -property installationPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $installation) { throw 'Visual Studio with C++ and CMake tools was not found.' }
          $cmake = Join-Path $installation 'Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe'
          if (-not (Test-Path $cmake)) { throw "Visual Studio CMake was not found: $cmake" }
          "CMAKE=$cmake" | Add-Content -Path $env:GITHUB_ENV
          Split-Path $cmake | Add-Content -Path $env:GITHUB_PATH
          Write-Host "Using CMake: $cmake"
          & $cmake --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Apple build and packaging dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install create-dmg meson ninja nasm
          sudo gem install cocoapods

      - name: Check native build tools
        shell: bash
        run: |
          set -euo pipefail
          meson --version
          ninja --version
          nasm --version

      - name: Enable Git long paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Initialize workspace
        shell: bash
        run: |
          set -euo pipefail
          ./init.sh

      - name: Build GitHub release artifact
        shell: bash
        run: |
          set -euo pipefail

          args=(
            release
            github
            build
            "${{ matrix.target }}"
            --ci
            --allow-dirty
            --output-dir
            "$OUTPUT_DIR"
          )

          if [[ "${{ matrix.target }}" == "ipa" ]]; then
            args+=(--no-codesign)
          fi

          if [[ "${{ matrix.target }}" == "windows-zip" ]]; then
            args+=(--flutter-verbose)
          fi

          ./build.sh "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/boorusama-build.log"

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.target }}
          include-hidden-files: true
          retention-days: 7
          path: |
            ${{ runner.temp }}/boorusama-build.log
            .dart_tool/hooks_runner/**/stdout.txt
            .dart_tool/hooks_runner/**/stderr.txt
            .dart_tool/hooks_runner/**/meson-log.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ env.OUTPUT_DIR }}/**
          if-no-files-found: error

  publish:
    if: github.actor == 'khoadng' && !inputs.windows_only
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      BOORUSAMA_USE_FVM: "false"
    steps:
      - name: Check out Boorusama
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          cache: true

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Delete existing release
        if: inputs.recreate_release
        shell: bash
        run: |
          set -euo pipefail
          gh release delete "${{ inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --cleanup-tag \
            --yes || true

      - name: Publish draft GitHub release
        shell: bash
        run: |
          set -euo pipefail

          args=(
            release
            github
            publish
            --ci
            --repo
            "${{ github.repository }}"
            --artifacts-dir
            release-assets
          )

          args+=(--tag "${{ inputs.release_tag }}")
          args+=(--title "Boorusama ${{ inputs.release_tag }}")

          if [[ "${{ inputs.prerelease }}" == "true" ]]; then
            args+=(--prerelease)
          fi

          ./build.sh "${args[@]}"
